[project]
name = "mission-brain"
version = "0.1.0"
description = "Retrieval-only second-brain over your own writing. Citation-grounded. BYOK."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "llama-index-core>=0.12",
    "llama-index-readers-file>=0.4",
    "python-frontmatter>=1.1",
    "ragas>=0.2",
    "httpx>=0.27",
    "lancedb>=0.30.2",
]

[project.scripts]
mission-brain = "mission_brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mission_brain"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
